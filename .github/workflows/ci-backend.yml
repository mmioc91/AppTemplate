name: backend-ci

on:
  # No `paths:` filter on pull_request: build-test is a required check in the
  # main-protection ruleset, and a path-filtered workflow that doesn't run leaves
  # docs/CI-only PRs stuck on "Expected - Waiting for status to be reported".
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.*.props'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/*.trx'

  # Report-only (break threshold 0 in each stryker-config.json); runs in parallel with build-test so PRs don't wait on
  # it. Only projects whose tests run without a database (ADR 0017).
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [Domain, Application]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --since needs the base branch history

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Restore tools
        run: dotnet tool restore

      # A pull request that rewrites most of a project can't be mutated within the job's 20 minutes, and a report-only
      # check that times out reads as a failure. Past 40 changed files it says so and skips; Stryker then runs locally
      # on the files that matter (tests/*/CLAUDE.md).
      - name: Size of the change
        id: size
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- "src/AppTemplate.${{ matrix.project }}")
          changed=$(printf '%s\n' "$files" | grep -c '\.cs$' || true)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" -gt 40 ]; then
            echo "::notice title=Mutation testing skipped::$changed C# files of AppTemplate.${{ matrix.project }} changed - too many to mutate in CI; run Stryker locally with -m on the files that matter."
          fi

      - name: Mutation testing (${{ matrix.project }} code changed in this PR)
        if: fromJSON(steps.size.outputs.changed) <= 40
        working-directory: src/AppTemplate.${{ matrix.project }}
        run: dotnet tool run dotnet-stryker --since:origin/${{ github.base_ref }}

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.project }}
          path: src/AppTemplate.${{ matrix.project }}/StrykerOutput/**/reports/
          if-no-files-found: ignore
