name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans the full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# License: gitleaks-action is free for personal and public repositories;
# for ORGANIZATIONS it requires a license key (GITLEAKS_LICENSE). If this blocks you,
# an alternative without that requirement is to install the gitleaks binary in a step
# and call `gitleaks detect --redact --no-banner`.
