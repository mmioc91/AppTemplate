name: web-ci

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  # Named apart from the backend-ci build-test job: branch protection matches required checks by job name, and this
  # job is path-filtered, so it must never be a required one (a PR without web changes would wait for it forever).
  web-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A change to this workflow runs it too; without a web/ folder yet there is nothing to build, so the steps below
      # skip instead of failing on npm ci. Decided on the runner: a job-level `if` cannot look at files (hashFiles is
      # not available there and fails the whole workflow file).
      - name: Is there a web app?
        id: web
        working-directory: .
        run: echo "present=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Pinned to the Node a project's web image builds with (node:22), so CI tests what ships.
      - uses: actions/setup-node@v4
        if: steps.web.outputs.present == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - if: steps.web.outputs.present == 'true'
        run: npm ci
      - if: steps.web.outputs.present == 'true'
        run: npm run lint
      - if: steps.web.outputs.present == 'true'
        run: npm run format:check
      - if: steps.web.outputs.present == 'true'
        run: npm run build -- --configuration production
      # Vitest on jsdom (the Angular default runner): no browser needed.
      - if: steps.web.outputs.present == 'true'
        run: npm test -- --watch=false
