name: web-ci

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  # Named apart from the backend-ci build-test job: branch protection matches required checks by job name, and this
  # job is path-filtered, so it must never be a required one (a PR without web changes would wait for it forever).
  web-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the Node a project's web image builds with (node:22), so CI tests what ships.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build -- --configuration production
      # Vitest on jsdom (the Angular default runner): no browser needed.
      - run: npm test -- --watch=false
