# Local dev infrastructure: Postgres.
# Start: docker compose up -d
# Stop:  docker compose down     (data stays in the volume)

services:
  db:
    image: postgres:17
    container_name: apptemplate-db
    environment:
      POSTGRES_DB: apptemplate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
