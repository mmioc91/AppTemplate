# Local dev infrastructure: Postgres, and Mailpit catching every mail the Api sends (web UI: http://localhost:8025).
# Start: docker compose up -d
# Stop:  docker compose down     (data stays in the volume)

services:
  db:
    image: postgres:17
    container_name: apptemplate-db
    environment:
      POSTGRES_DB: apptemplate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The same tag as ci-e2e.yml and SmtpMailTransportTests run: bump all three together.
  mail:
    image: axllent/mailpit:v1.31.6
    container_name: apptemplate-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
